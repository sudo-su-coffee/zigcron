name: Release Linux Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - target: x86_64-linux-gnu
            output_name: zigcron-linux-x86_64
          - target: aarch64-linux-gnu
            output_name: zigcron-linux-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build Binary
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall
          mkdir -p release_dist
          cp zig-out/bin/zigcron release_dist/${{ matrix.output_name }}
          chmod +x release_dist/${{ matrix.output_name }}

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_dist/*
          name: "zigcron ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}