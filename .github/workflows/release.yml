name: Build zigcron

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: goto-bus-stop/setup-zig@v2
        with:
          zig-version: 0.13.0
      
      - name: Test
        run: zig build test
      
      - name: Build
        run: zig build -Doptimize=ReleaseSmall
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zigcron
          path: zig-out/