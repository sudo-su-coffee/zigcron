name: Release Linux Binaries

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.0, v1.1.0, etc.

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to attach binaries to GitHub Releases

    strategy:
      matrix:
        include:
          - target: x86_64-linux-gnu
            output_name: zigcron-linux-x86_64
          - target: aarch64-linux-gnu
            output_name: zigcron-linux-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build Binary
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall
          mkdir -p release_dist
          cp zig-out/bin/zigcron release_dist/${{ matrix.output_name }}

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          name: "zigcron ${{ github.ref_name }}"
          generate_release_notes: true